<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<title>OG-cover ЧИСТЮЛЯ</title>
<style>
  *{box-sizing:border-box;margin:0;padding:0}
  body{background:#0b2136;font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
  #cover{
    width:1200px;height:630px;position:relative;overflow:hidden;
    background:
      radial-gradient(900px 520px at 88% -10%, rgba(56,189,248,.55), transparent 62%),
      radial-gradient(700px 460px at 6% 108%, rgba(2,132,199,.55), transparent 60%),
      linear-gradient(135deg,#f6fbff 0%,#dceefb 46%,#b9e1f9 100%);
  }
  .grid{position:absolute;inset:0;
    background-image:linear-gradient(rgba(2,132,199,.07) 1px,transparent 1px),
                     linear-gradient(90deg,rgba(2,132,199,.07) 1px,transparent 1px);
    background-size:48px 48px;}

  .logo{position:absolute;left:74px;top:72px;display:flex;align-items:center;gap:16px}
  .mark{width:74px;height:74px;border-radius:22px;display:grid;place-items:center;color:#fff;
    background:linear-gradient(135deg,#38bdf8,#0284c7);box-shadow:0 18px 40px -14px rgba(2,132,199,.9)}
  .mark svg{width:42px;height:42px}
  .wordmark{font-weight:900;font-size:42px;letter-spacing:.08em;color:#0c4a6e}

  h1{position:absolute;left:74px;top:196px;font-size:66px;line-height:1.04;color:#0b3b55;font-weight:900}
  h1 em{font-style:normal;color:#0284c7}

  .lead{position:absolute;left:78px;top:352px;font-size:29px;color:#155e75;font-weight:600}

  .chips{position:absolute;left:74px;top:428px;display:flex;gap:12px;flex-wrap:wrap}
  .chip{padding:12px 22px;border-radius:999px;background:rgba(255,255,255,.9);border:2px solid rgba(2,132,199,.25);
    color:#0c4a6e;font-size:21px;font-weight:700;box-shadow:0 8px 22px -14px rgba(2,132,199,.9)}

  .phone{position:absolute;right:74px;bottom:66px;display:flex;align-items:center;gap:14px;
    background:#0284c7;color:#fff;padding:20px 34px;border-radius:20px;font-size:34px;font-weight:900;
    box-shadow:0 26px 54px -20px rgba(2,132,199,1)}
  .phone svg{width:34px;height:34px}
  .site{position:absolute;left:74px;bottom:76px;font-size:23px;color:#0c4a6e;font-weight:700;opacity:.85}

  .bubble{position:absolute;border-radius:50%;background:rgba(255,255,255,.55);filter:blur(.3px)}
  .b1{width:180px;height:180px;right:-40px;top:-50px}
  .b2{width:96px;height:96px;right:230px;bottom:-30px;background:rgba(255,255,255,.4)}
</style>
</head>
<body>
<div id="cover">
  <div class="grid"></div>
  <div class="bubble b1"></div>
  <div class="bubble b2"></div>

  <div class="logo">
    <div class="mark"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3l1.9 5.1L19 10l-5.1 1.9L12 17l-1.9-5.1L5 10l5.1-1.9L12 3z"/></svg></div>
    <div class="wordmark" id="oCompany">ЧИСТЮЛЯ</div>
  </div>

  <h1>Чисто до блеска.<br><em>Без вашего участия.</em></h1>
  <div class="lead" id="oLead">Клининговая служба в Барановичах и окрестностях</div>

  <div class="chips">
    <div class="chip">Генеральная уборка</div>
    <div class="chip">Уборка после ремонта</div>
    <div class="chip">Химчистка мебели</div>
    <div class="chip">Мойка окон</div>
  </div>

  <div class="site">Заявка за 2 минуты · ответим в течение 15 минут</div>

  <div class="phone">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M22 16.9v3a2 2 0 0 1-2.2 2 19.8 19.8 0 0 1-8.6-3.1 19.5 19.5 0 0 1-6-6A19.8 19.8 0 0 1 2.1 4.2 2 2 0 0 1 4.1 2h3a2 2 0 0 1 2 1.7c.1 1 .4 1.9.7 2.8a2 2 0 0 1-.5 2.1L8.1 9.9a16 16 0 0 0 6 6l1.3-1.3a2 2 0 0 1 2.1-.4c.9.3 1.8.6 2.8.7a2 2 0 0 1 1.7 2z"/></svg>
    <span id="oPhone">+375 (29) 000-00-00</span>
  </div>
</div>

<script src="config.js?v=29"></script>
<script>
(function(){
  var C = window.CONFIG || {};
  function set(id, v){ var el = document.getElementById(id); if (el && v) el.textContent = v; }
  set('oCompany', C.COMPANY);
  set('oPhone', C.PHONE_HUMAN || C.PHONE);
  if (C.AREA) set('oLead', 'Клининговая служба' + (C.AREA.indexOf('Работаем') === 0 ? C.AREA.slice('Работаем'.length) : ' в ' + C.CITY));
})();
</script>
</body>
</html>
